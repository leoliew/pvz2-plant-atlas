<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PvZ2 Plant Seed Packets · Print</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#fbf4e4;--sand:#e9d9ae;--ink:#33261a;--muted:#7a6247;--sun:#ffc021;--rim:#e08a00;--en:Fredoka,"Arial Rounded MT Bold",sans-serif;--zh:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}html,body{margin:0;background:#e3e0d8;color:var(--ink);font-family:var(--en),var(--zh);line-height:1.15}.page{width:210mm;height:297mm;background:#fff;position:relative;overflow:hidden;padding:8mm 9mm 7mm;margin:0 auto 8mm;display:flex;flex-direction:column;page-break-after:always}.page:last-child{page-break-after:auto}.hdr{display:flex;align-items:baseline;justify-content:space-between;height:8mm;margin-bottom:3.5mm}.hdr .t{font-size:13pt;font-weight:700}.hdr .zh{font-family:var(--zh);font-size:11.5pt;margin-left:1.5mm;color:var(--muted)}.hdr .p{font-size:9.5pt;color:var(--muted);font-weight:600}.ftr{position:absolute;left:0;right:0;bottom:2.6mm;text-align:center;font-size:7pt;color:#a8977c}.grid{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:5mm 6mm}.card{--c:#5da33b;position:relative;display:flex;flex-direction:column;background:var(--paper);border:.7mm solid var(--c);border-radius:4.5mm;overflow:hidden;outline:.25mm dashed #c9bfa8;outline-offset:1.6mm}.pic{position:relative;flex:1;min-height:42mm;background:radial-gradient(circle at 50% 32%,#fff 0,#fdf8ec 60%,var(--sand) 150%);display:flex;align-items:center;justify-content:center}.pic .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}.pic .art{position:relative;z-index:1;max-width:80%;max-height:80%;object-fit:contain;filter:drop-shadow(0 1.4mm 1.6mm rgba(90,58,25,.24))}.tag{position:absolute;top:3mm;left:3mm;padding:.9mm 2.8mm;border-radius:5mm;background:var(--c);color:#fff;font-size:7.5pt;font-weight:700;box-shadow:0 .6mm 1.4mm rgba(0,0,0,.18);z-index:2}.sunbadge{position:absolute;top:3mm;right:3mm;min-width:9.5mm;height:9.5mm;padding:0 1.6mm;border-radius:5mm;background:var(--sun);border:.6mm solid var(--rim);display:flex;align-items:center;justify-content:center;color:#5a3a00;font-size:9.5pt;font-weight:700;box-shadow:0 .6mm 1.4mm rgba(0,0,0,.18);z-index:2}.label{position:absolute;left:0;right:0;bottom:0;padding:7mm 3.5mm 2mm;background:linear-gradient(180deg,rgba(30,20,10,0) 0%,rgba(30,20,10,.6) 100%);z-index:2}.label .en{color:#fff;font-size:16pt;font-weight:700;line-height:1;text-shadow:0 .5mm 1mm rgba(0,0,0,.35)}.label .zh{font-family:var(--zh);color:#fff;font-size:9.5pt;opacity:.92;margin-top:.6mm}.body{padding:3mm 3.5mm 0;display:flex;flex-direction:column;gap:2mm}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1.8mm}.stat{display:flex;flex-direction:column;align-items:center;gap:.5mm;background:#fff;border:.4mm solid var(--sand);border-radius:2.8mm;padding:1.6mm 1mm}.stat .ic{color:var(--c);font-size:12pt;line-height:1}.stat .v{font-size:11.5pt;font-weight:700;color:var(--c);white-space:nowrap}.stat .k{font-size:7pt;font-weight:600;text-align:center;line-height:1.2}.stat .k small{display:block;font-family:var(--zh);font-size:6pt;color:var(--muted);font-weight:500}.range{display:flex;align-items:center;gap:1.5mm;font-size:9pt;font-weight:600;padding:0 1mm}.range .ic{color:var(--c);font-size:12pt}.range .zh{font-family:var(--zh);font-size:8pt;font-weight:500;color:var(--muted)}.say{margin:0 3.5mm;padding:2.2mm 3mm;background:#fff;border-left:1.6mm solid var(--c);border-radius:0 3mm 3mm 0}.say .en{font-size:11pt;font-weight:600;line-height:1.2}.say .zh{font-family:var(--zh);font-size:8.5pt;color:var(--muted);margin-top:.8mm}.official{font-family:var(--zh);font-size:7.5pt;color:var(--muted);padding:0 3.5mm;line-height:1.25}.official b{color:var(--c);font-family:var(--en),var(--zh)}.words{display:grid;grid-template-columns:repeat(3,1fr);gap:2.2mm;padding:0 3.5mm 3.2mm}.word{background:var(--c);color:#fff;border-radius:2.8mm;text-align:center;padding:1.5mm 1mm}.word .en{font-size:11pt;font-weight:700;line-height:1}.word .zh{font-family:var(--zh);font-size:7.5pt;margin-top:1mm}.empty{padding:30mm;text-align:center;font-size:18pt}@media print{html,body{background:#fff}.page{margin:0}}
</style></head><body><main id="book"><div class="empty">Loading plant cards…</div></main>
<script type="module">
import plants from './plants_egypt.json';
import { resolveWorldBackgroundFile } from './src/world-backgrounds.js';
const book=document.querySelector('#book');
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const background=p=>`<img class="bg" src="public/images/backgrounds/${resolveWorldBackgroundFile(p.obtain_world_code)}.webp" alt="" loading="lazy">`;
const image=p=>`<img class="art" src="public/images/${esc(p.pvzg_file||p.file)}" onerror="this.onerror=null;this.src='${esc(p.img||'')}'" alt="${esc(p.en)}">`;
const card=p=>`<article class="card" style="--c:${esc(p.color||'#5da33b')}"><div class="pic">${background(p)}${image(p)}<div class="tag">${esc(p.family||'')}</div><div class="sunbadge">☀${esc(p.sun)}</div><div class="label"><div class="en">${esc(p.en)}</div><div class="zh">${esc(p.zh)}</div></div></div><div class="body"><div class="stats"><div class="stat"><div class="ic">◷</div><div class="v">${esc(p.recharge)}</div><div class="k">Recharge<small>冷却</small></div></div><div class="stat"><div class="ic">♥</div><div class="v">${esc(p.toughness)}</div><div class="k">Toughness<small>生命</small></div></div><div class="stat"><div class="ic">ϟ</div><div class="v">${esc(p.damage)}</div><div class="k">Damage<small>攻击</small></div></div></div><div class="range"><span class="ic">➜</span>${esc(p.range)} <span class="zh">${esc(p.range_zh)}</span></div><div class="say"><div class="en">${esc(p.sentence)}</div><div class="zh">${esc(p.sentence_zh)}</div></div><div class="words">${(p.words||[]).slice(0,3).map(([en,zh])=>`<div class="word"><div class="en">${esc(en)}</div><div class="zh">${esc(zh)}</div></div>`).join('')}</div></div></article>`;
const perPage=4,total=Math.ceil(plants.length/perPage);book.innerHTML=Array.from({length:total},(_,i)=>`<section class="page"><div class="hdr"><div class="t">Plants vs. Zombies 2 · Plant Seed Packets<span class="zh">植物种子卡</span></div><div class="p">${i+1} / ${total}</div></div><div class="grid">${plants.slice(i*perPage,(i+1)*perPage).map(card).join('')}</div><div class="ftr">Data &amp; art: PvZ2 Gardendless · 沿虚线裁下即为单词卡</div></section>`).join('');
</script></body></html>
