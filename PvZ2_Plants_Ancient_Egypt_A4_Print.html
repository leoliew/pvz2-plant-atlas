<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PvZ2 Plant Seed Packets · Print</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#fbf4e4;--sand:#e9d9ae;--ink:#33261a;--muted:#7a6247;--sun:#ffc021;--rim:#e08a00;--en:Fredoka,"Arial Rounded MT Bold",sans-serif;--zh:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}html,body{margin:0;background:#e3e0d8;color:var(--ink);font-family:var(--en),var(--zh);line-height:1.15}.page{width:210mm;height:297mm;background:#fff;position:relative;overflow:hidden;padding:8mm 9mm 7mm;margin:0 auto 8mm;display:flex;flex-direction:column;page-break-after:always}.page:last-child{page-break-after:auto}.hdr{display:flex;align-items:baseline;justify-content:space-between;height:8mm;margin-bottom:3.5mm}.hdr .t{font-size:13pt;font-weight:700}.hdr .zh{font-family:var(--zh);font-size:11.5pt;margin-left:1.5mm;color:var(--muted)}.hdr .p{font-size:9.5pt;color:var(--muted);font-weight:600}.ftr{position:absolute;left:0;right:0;bottom:2.6mm;text-align:center;font-size:7pt;color:#a8977c}.grid{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:5mm 6mm}.card{--c:#5da33b;position:relative;display:flex;flex-direction:column;background:var(--paper);border:.7mm solid var(--c);border-radius:4.5mm;overflow:hidden;outline:.25mm dashed #c9bfa8;outline-offset:1.6mm}.ribbon{display:flex;align-items:baseline;justify-content:space-between;gap:2mm;background:var(--c);color:#fff;padding:2mm 4mm 2.2mm}.ribbon .en{font-size:20pt;font-weight:700;line-height:1;white-space:nowrap}.ribbon .zh{font-family:var(--zh);font-size:12pt;font-weight:600;white-space:nowrap}.body{display:grid;grid-template-columns:42mm 1fr;gap:3mm;padding:3mm 3.5mm 0}.pic{position:relative;height:56mm;border-radius:3.5mm;background:#fff;border:.4mm solid var(--sand);display:flex;align-items:center;justify-content:center}.pic img{max-width:88%;max-height:88%;object-fit:contain}.sunbadge{position:absolute;left:-2.5mm;bottom:-2.5mm;width:17mm;height:17mm;border-radius:50%;background:var(--sun);border:1.5mm solid var(--rim);display:flex;align-items:center;justify-content:center;color:#5a3a00;font-size:14pt;font-weight:700}.stats{display:flex;flex-direction:column;justify-content:space-between}.stat{display:grid;grid-template-columns:6.5mm 1fr auto;align-items:center;column-gap:1.5mm;background:#fff;border:.4mm solid var(--sand);border-radius:2.8mm;padding:1.4mm 2.2mm 1.4mm 1.8mm}.stat .ic{color:var(--c);font-size:14pt;text-align:center}.stat .k{font-size:10.5pt;font-weight:600;line-height:1}.stat .k small{display:block;font-family:var(--zh);font-size:8pt;color:var(--muted);margin-top:.7mm;font-weight:500}.stat .v{font-size:14pt;font-weight:700;color:var(--c);white-space:nowrap}.range{display:flex;align-items:center;gap:1.5mm;font-size:9.5pt;font-weight:600;padding:0 1mm}.range .ic{color:var(--c);font-size:13pt}.range .zh{font-family:var(--zh);font-size:8.5pt;font-weight:500;color:var(--muted)}.say{margin:2.5mm 3.5mm 0;padding:2.2mm 3mm;background:#fff;border-left:1.6mm solid var(--c);border-radius:0 3mm 3mm 0}.say .en{font-size:12pt;font-weight:600;line-height:1.2}.say .zh{font-family:var(--zh);font-size:9pt;color:var(--muted);margin-top:1mm}.official{font-family:var(--zh);font-size:7.5pt;color:var(--muted);padding:1.5mm 3.5mm 0;line-height:1.25}.official b{color:var(--c);font-family:var(--en),var(--zh)}.words{display:grid;grid-template-columns:repeat(3,1fr);gap:2.2mm;padding:2.5mm 3.5mm 3.2mm;margin-top:auto}.word{background:var(--c);color:#fff;border-radius:2.8mm;text-align:center;padding:1.5mm 1mm}.word .en{font-size:12pt;font-weight:700;line-height:1}.word .zh{font-family:var(--zh);font-size:8pt;margin-top:1mm}.empty{padding:30mm;text-align:center;font-size:18pt}@media print{html,body{background:#fff}.page{margin:0}}
</style>
<style>
.body{grid-template-columns:48mm 1fr}
.pic{height:42mm}
.pic img{max-width:96%;max-height:96%;object-fit:contain}
</style></head><body><main id="book"><div class="empty">Loading plant cards…</div></main>
<script type="module">
import plants from './plants_egypt.json';
const book=document.querySelector('#book');
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const image=p=>`<img src="public/images/${esc(p.pvzg_file||p.file)}" onerror="this.onerror=null;this.src='${esc(p.img||'')}'" alt="${esc(p.en)}">`;
const card=p=>`<article class="card" style="--c:${esc(p.color||'#5da33b')}"><div class="ribbon"><div class="en">${esc(p.en)}</div><div class="zh">${esc(p.zh)}</div></div><div class="body"><div class="pic">${image(p)}<div class="sunbadge">${esc(p.sun)}</div></div><div class="stats"><div class="stat"><div class="ic">◷</div><div class="k">Recharge<small>冷却</small></div><div class="v">${esc(p.recharge)}<small>${esc(p.recharge_zh)}</small></div></div><div class="stat"><div class="ic">♥</div><div class="k">Toughness<small>生命</small></div><div class="v">${esc(p.toughness)}</div></div><div class="stat"><div class="ic">ϟ</div><div class="k">Damage<small>攻击</small></div><div class="v">${esc(p.damage)}</div></div><div class="range"><span class="ic">➜</span>${esc(p.range)} <span class="zh">${esc(p.range_zh)}</span></div></div></div><div class="say"><div class="en">${esc(p.sentence)}</div><div class="zh">${esc(p.sentence_zh)}</div></div><div class="words">${(p.words||[]).slice(0,3).map(([en,zh])=>`<div class="word"><div class="en">${esc(en)}</div><div class="zh">${esc(zh)}</div></div>`).join('')}</div></article>`;
const perPage=4,total=Math.ceil(plants.length/perPage);book.innerHTML=Array.from({length:total},(_,i)=>`<section class="page"><div class="hdr"><div class="t">Plants vs. Zombies 2 · Plant Seed Packets<span class="zh">植物种子卡</span></div><div class="p">${i+1} / ${total}</div></div><div class="grid">${plants.slice(i*perPage,(i+1)*perPage).map(card).join('')}</div><div class="ftr">Data &amp; art: PvZ2 Gardendless · 沿虚线裁下即为单词卡</div></section>`).join('');
</script></body></html>
